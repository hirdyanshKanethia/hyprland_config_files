# Dark Bluish Theme for Gazelle TUI

# Base colors
background = "#0f1b2b"
foreground = "#c0d0e0"

# Border / accent
accent = "#4f83cc"

# Titles and headers
title = "#e0e0ff"
header = "#8faee6"

# Selection
selection_background = "#336699"
selection_foreground = "#ffffff"

# Highlighted entry (active item)
highlight = "#5588cc"

# Muted / inactive text
dim_foreground = "#708090"

# Errors / warnings
error = "#ff5555"

# Success / connected
success = "#55ff99"

# Wifi signal bars (optional)
signal_full = "#66ccff"
signal_medium = "#4f83cc"
signal_low = "#336699"

# 802.1X / enterprise auth highlight
eap_label = "#7faaff"

# Cursor / input
input_cursor = "#ffffff"
