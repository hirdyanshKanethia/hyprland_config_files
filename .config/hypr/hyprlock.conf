# BATTERY LEVEL INDICATOR (Text)
label {
  monitor =
  text = cmd[update:10000] cat /sys/class/power_supply/BAT0/capacity | awk '{print ""$1"% 󰁹"}'
  color = rgba(198, 198, 207, 0.85) # Pywal color7 (#c6c6cf)
  font_size = 18
  font_family = Cascadia Code NF
  position = 845, -390
  halign = center
  valign = center
}
