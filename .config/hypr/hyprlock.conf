# BACKGROUND
background {
    monitor =
    #path = screenshot
    path = /home/hirdyansh/Pictures/wallpapers/guts_pc_wallpaper.jpg
    #color = $background
    blur_passes = 0
    contrast = 1
    brightness = 1.0
    vibrancy = 0.3
    vibrancy_darkness = 0.3
}

# GENERAL
general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = false
    bezier = linear, 1, 1, 0, 0
    animation = fade, 1, 1.8, linear
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(139, 104, 152, 0.8) # Pywal color4 (#8B6898)
    inner_color = rgba(27, 30, 65, 0.6)    # Pywal color0 (#1b1e41)
    font_color = rgb(198, 198, 207)        # Pywal color7 (#c6c6cf)
    fade_on_empty = false
    rounding = -1
    check_color = rgb(111, 185, 219)       # Pywal color6 (#6FB9DB)
    placeholder_text = <i><span foreground="##c6c6cf">Enter Password...</span></i> # Pywal color7
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:10000] date "+%A, %d %B %Y"
  color = rgba(198, 198, 207, 0.85) # Pywal color7 (#c6c6cf)
  font_size = 22
  font_family = Cascadia Code NF
  position = 0, 350
  halign = center
  valign = center
}

# TIME
label {
  monitor =
  text = cmd[update:10000] date "+%I:%M"
  color = rgba(198, 198, 207, 0.85) # Pywal color7 (#c6c6cf)
  font_size = 95
  font_family = Cascadia Code NF
  position = 0, 250
  halign = center
  valign = center
}

# QUOTE TEXT
label {
  monitor =
  text = "There is no paradise for you to escape to"
  color = rgba(198, 198, 207, 0.9) # Pywal color7 (#c6c6cf)
  font_size = 24
  font_family = DejaVu Serif italic
  position = 0, 50
  halign = center
  valign = center
}

