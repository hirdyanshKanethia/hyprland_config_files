# include ~/.cache/wal/colors-kitty.conf

font_family Caskaydia Code NF
bold_font        auto
italic_font      auto
bold_italic_font auto

cursor_shape block
cursor_blink_interval 0

font_size 13

background_opacity 0.7

cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ---------------- Kitty Configuration ----------------
# Converted from Ghostty config

# Font Configuration
font_size        10.0

# Disable ligatures
disable_ligatures always

# Cursor
cursor_shape     block
cursor_blink_interval 0.5

# Transparency / Blur
background_opacity 0.8
background_blur    20

# Colors (pywal)
background        #1b1e41
foreground        #c6c6cf
cursor            #c6c6cf

selection_background #c6c6cf
selection_foreground #1b1e41

# ANSI Palette

# Black
color0  #000000
color8  #808080

# Red
color1  #ff0000
color9  #ff3333

# Green
color2  #00ff00
color10 #33ff33

# Yellow
color3  #ffff00
color11 #ffff33

# Blue
color4  #0080ff
color12 #3399ff

# Magenta
color5  #ff00ff
color13 #ff33ff

# Cyan
color6  #00ffff
color14 #33ffff

# White
color7  #c0c0c0
color15 #ffffff

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait 1.0

# Clipboard
copy_on_select no

# Shell Integration
shell_integration enabled

# Cursor Trail (closest equivalent to your Ghostty shader)
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Optional padding (uncomment if desired)
# window_padding_width 8

# Optional no titlebar (Wayland/X11 WM dependent)
hide_window_decorations yes
