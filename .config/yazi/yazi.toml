[mgr]
show_hidden = true
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "none"
show_symlink = true
scrolloff = 8
ratio = [1, 3, 4]

[preview]
tab_size = 4
max_width = 1800
max_height = 2400
image_delay = 0

[opener]

edit = [
    { run = 'nvim "$@"', block = true },
]

open = [
    { run = 'xdg-open "$1"', orphan = true },
]

extract = [
    { run = 'ouch decompress "$@"', orphan = false, block = true },
]

play = [
    { run = 'mpv "$@"', orphan = true },
]

[open]
prepend_rules = [
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "application/x-shellscript", use = "edit" },
    { mime = "video/*", use = "play" },
    { mime = "audio/*", use = "play" },
]
